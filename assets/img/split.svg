<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <title>Сплит-система</title>
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcfe"/>
      <stop offset="1" stop-color="#e4eff7"/>
    </linearGradient>
    <linearGradient id="sp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe8f2"/>
    </linearGradient>
    <pattern id="sp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0a141f" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="360" fill="url(#sp-bg)"/>
  <rect width="480" height="360" fill="url(#sp-grid)"/>

  <!-- холодный поток от внутреннего блока -->
  <g fill="none" stroke="#00a9e0" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <path d="M126 156c0 18-10 30-26 34"/>
    <path d="M182 156c0 26-8 44-22 56"/>
    <path d="M238 156c0 18-8 30-22 36"/>
  </g>
  <g fill="#00a9e0" opacity="0.85">
    <path d="M98 194l11-8 2 11z"/>
    <path d="M158 216l11-8 2 11z"/>
    <path d="M214 196l11-8 2 11z"/>
  </g>

  <!-- внутренний блок -->
  <rect x="98" y="104" width="196" height="52" rx="10" fill="url(#sp-body)" stroke="#5d7d96" stroke-width="2.5"/>
  <path d="M110 142h172" stroke="#9db8cb" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 132h172" stroke="#c8dae6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="272" cy="120" r="4" fill="#00a9e0"/>
  <rect x="112" y="112" width="52" height="12" rx="3" fill="#eef6fb" stroke="#c2d5e2" stroke-width="1.2"/>

  <!-- трубки -->
  <g fill="none" stroke-linecap="round">
    <path d="M294 138c34 0 52 16 58 44 6 28 12 44 24 52" stroke="#c98a4b" stroke-width="5"/>
    <path d="M294 126c22 0 30 10 34 30 5 26 12 44 22 54" stroke="#5d7d96" stroke-width="3"/>
  </g>

  <!-- наружный блок -->
  <g>
    <rect x="300" y="212" width="122" height="86" rx="9" fill="url(#sp-body)" stroke="#5d7d96" stroke-width="2.5"/>
    <g transform="translate(332 255)">
      <circle r="28" fill="#f2f8fc" stroke="#6d8ca3" stroke-width="2"/>
      <g fill="#cfe3f0" stroke="#6d8ca3" stroke-width="1.4">
        <path d="M0 0C9-7 20-2 19 7 18 14 9 17 3 12 0 10-1 5 0 0Z"/>
        <path d="M0 0C9-7 20-2 19 7 18 14 9 17 3 12 0 10-1 5 0 0Z" transform="rotate(120)"/>
        <path d="M0 0C9-7 20-2 19 7 18 14 9 17 3 12 0 10-1 5 0 0Z" transform="rotate(240)"/>
      </g>
      <circle r="5" fill="#00a9e0"/>
    </g>
    <g stroke="#9db8cb" stroke-width="2" stroke-linecap="round">
      <path d="M370 228h38M370 238h38M370 248h38M370 258h38M370 268h38M370 278h38"/>
    </g>
    <path d="M300 212h122" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M312 298v10M410 298v10" stroke="#94afc3" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- хладагент -->
  <g font-family="Manrope, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#7e93a6">
    <text x="356" y="200">R404A</text>
  </g>
  <circle cx="356" cy="196" r="3" fill="#00a9e0"/>
</svg>
