<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <title>Компрессорно-конденсаторный блок</title>
  <defs>
    <linearGradient id="kk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcfe"/>
      <stop offset="1" stop-color="#e4eff7"/>
    </linearGradient>
    <linearGradient id="kk-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe8f2"/>
    </linearGradient>
    <linearGradient id="kk-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe1ee"/>
      <stop offset="0.4" stop-color="#f5fafd"/>
      <stop offset="1" stop-color="#b9d2e2"/>
    </linearGradient>
    <pattern id="kk-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0a141f" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="360" fill="url(#kk-bg)"/>
  <rect width="480" height="360" fill="url(#kk-grid)"/>
  <ellipse cx="240" cy="318" rx="172" ry="14" fill="#0a141f" opacity="0.07"/>

  <!-- рама -->
  <g stroke="#7d9aae" stroke-width="6" stroke-linecap="round">
    <path d="M78 286h324"/>
    <path d="M92 286v22M388 286v22"/>
  </g>

  <!-- конденсатор -->
  <rect x="78" y="92" width="324" height="112" rx="10" fill="url(#kk-body)" stroke="#5d7d96" stroke-width="2.5"/>
  <g stroke="#c8dae6" stroke-width="1.6">
    <path d="M92 100h296M92 196h296"/>
  </g>
  <!-- рёбра -->
  <g stroke="#b6cddc" stroke-width="1.4">
    <path d="M88 108h16M88 120h16M88 132h16M88 144h16M88 156h16M88 168h16M88 180h16M88 192h16"/>
    <path d="M376 108h16M376 120h16M376 132h16M376 144h16M376 156h16M376 168h16M376 180h16M376 192h16"/>
  </g>

  <!-- вентиляторы -->
  <g transform="translate(168 148)">
    <circle r="40" fill="#f2f8fc" stroke="#5d7d96" stroke-width="2.5"/>
    <g fill="#cfe3f0" stroke="#6d8ca3" stroke-width="1.6">
      <path d="M0 0C12-9 28-3 26 9 25 18 13 22 4 16 0 13-2 6 0 0Z"/>
      <path d="M0 0C12-9 28-3 26 9 25 18 13 22 4 16 0 13-2 6 0 0Z" transform="rotate(120)"/>
      <path d="M0 0C12-9 28-3 26 9 25 18 13 22 4 16 0 13-2 6 0 0Z" transform="rotate(240)"/>
    </g>
    <circle r="7" fill="#00a9e0" stroke="#007fae" stroke-width="1.6"/>
  </g>
  <g transform="translate(312 148)">
    <circle r="40" fill="#f2f8fc" stroke="#5d7d96" stroke-width="2.5"/>
    <g fill="#cfe3f0" stroke="#6d8ca3" stroke-width="1.6">
      <path d="M0 0C12-9 28-3 26 9 25 18 13 22 4 16 0 13-2 6 0 0Z"/>
      <path d="M0 0C12-9 28-3 26 9 25 18 13 22 4 16 0 13-2 6 0 0Z" transform="rotate(120)"/>
      <path d="M0 0C12-9 28-3 26 9 25 18 13 22 4 16 0 13-2 6 0 0Z" transform="rotate(240)"/>
    </g>
    <circle r="7" fill="#00a9e0" stroke="#007fae" stroke-width="1.6"/>
  </g>

  <!-- компрессор -->
  <g>
    <path d="M118 214h74v14a37 37 0 0 1-74 0z" fill="url(#kk-metal)" stroke="#5d7d96" stroke-width="2.5"/>
    <ellipse cx="155" cy="214" rx="37" ry="11" fill="#f7fbfe" stroke="#5d7d96" stroke-width="2.5"/>
    <ellipse cx="155" cy="214" rx="22" ry="6" fill="none" stroke="#b6cddc" stroke-width="1.5"/>
    <path d="M118 244h74" stroke="#9db8cb" stroke-width="2"/>
    <path d="M126 266v20M184 266v20" stroke="#7d9aae" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ресивер -->
  <g>
    <rect x="286" y="212" width="30" height="76" rx="15" fill="url(#kk-metal)" stroke="#5d7d96" stroke-width="2.5"/>
    <path d="M286 234h30M286 258h30" stroke="#c8dae6" stroke-width="1.6"/>
    <rect x="341" y="222" width="46" height="34" rx="5" fill="#f7fbfe" stroke="#5d7d96" stroke-width="2"/>
    <rect x="349" y="230" width="30" height="12" rx="2" fill="#0d2637"/>
    <text x="364" y="240" font-family="Manrope, Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#37c2ef" text-anchor="middle">−25°</text>
    <circle cx="355" cy="250" r="3" fill="#00a9e0"/>
    <circle cx="364" cy="250" r="3" fill="#c2d5e2"/>
    <circle cx="373" cy="250" r="3" fill="#c2d5e2"/>
  </g>

  <!-- трубопровод -->
  <g fill="none" stroke-linecap="round">
    <path d="M192 232h50c14 0 24 10 24 24v18" stroke="#c98a4b" stroke-width="4.5"/>
    <path d="M184 216v-8h44" stroke="#9db8cb" stroke-width="3.5"/>
    <path d="M316 288v-14h40" stroke="#9db8cb" stroke-width="3.5"/>
  </g>

  <g font-family="Manrope, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#7e93a6" letter-spacing="1">
    <text x="78" y="76">КОНДЕНСАТОР</text>
    <text x="118" y="322">КОМПРЕССОР</text>
    <text x="300" y="322">РЕСИВЕР</text>
  </g>
</svg>
